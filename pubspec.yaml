name: sekkeh_af
description: Sekkeh Afghanistan Wallet Demo
publish_to: "none"
version: 3.4.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  printing: ^5.13.1
  pdf: ^3.11.1
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0B1026"
  adaptive_icon_foreground: "assets/logo.png"
