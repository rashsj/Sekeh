name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --org af.sekkeh --project-name sekkeh_af --platforms=android /tmp/gen
          cp -r /tmp/gen/android ./android
          rm -f android/local.properties

      - name: New app icon
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-hosny-amiri
          fc-cache -f >/dev/null 2>&1 || true
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o /tmp/icon.png
          cp /tmp/icon.png assets/logo.png

      - name: Manifest
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import re, os
          run = os.environ.get('RUN_NO','0')
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          s=re.sub(r'android:label="[^"]*"','android:label="Sekkeh r%s"'%run,s,count=1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Lint off
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/lint-off.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
            p.plugins.withId('com.android.base') {
              def a = p.extensions.findByName('android')
              if (a != null) { a.lint.checkReleaseBuilds = false; a.lint.abortOnError = false }
            }
          }
          GRADLE

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: dart run flutter_launcher_icons

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release --dart-define=BUILD_TAG=r${{ github.run_number }} 2>&1 | tee build.log; then
            echo "================ REAL ERROR ================"
            grep -n -B2 -A25 -E "Error:|error:|What went wrong|FAILURE:|Exception" build.log | head -n 150
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sekkeh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
