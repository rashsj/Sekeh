name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform
        run: |
          flutter create --org af.sekkeh --project-name sekkeh_af --platforms=android /tmp/gen
          cp -r /tmp/gen/android ./android
          rm -f android/local.properties

      - name: Set permission and app name
        run: |
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          s=re.sub(r'android:label="[^"]*"','android:label="Sekkeh"',s,count=1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sekkeh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
